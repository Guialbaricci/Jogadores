spring.application.name=cadastro-jogadores

# ---- Banco de dados PostgreSQL ----
# O banco "cadastro_jogador" precisa existir (crie no pgAdmin). As tabelas o Spring cria sozinho.
spring.datasource.url=jdbc:postgresql://localhost:5432/cadastro_jogador
spring.datasource.username=postgres
# ATENCAO: troque pela senha do seu PostgreSQL (a que você definiu ao instalar)
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- Hibernate / JPA ----
# update = cria/atualiza as tabelas automaticamente sem apagar os dados
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Mostra a mensagem dos erros (ex: "Nome não encontrado!") para o frontend exibir
server.error.include-message=always
